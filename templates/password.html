{{ define "title" }}Change Password{{ end }}

{{ define "content" }}
{{ if .Error }}
<div class="alert alert-danger">{{ .Error }}</div>
{{ end }}
<form action="." method="post">
	<fieldset>
		<legend>Change Password</legend>
		<div class="form-group">
			<label for="current">Current password</label>
			<input type="password" name="current" class="form-control" id="current" placeholder="Enter current password">
		</div>
		<div class="form-group">
			<label for="password">New password</label>
			<input type="password" name="password" class="form-control" id="password" placeholder="Enter new password">
		</div>
		<div class="form-group">
			<label for="pass2">New password (again)</label>
			<input type="password" name="pass2" class="form-control" id="pass2" placeholder="Re-enter new password">
		</div>
		<input type="submit" value="change password" class="btn btn-default" />
	</fieldset>
</form>
{{ end }}
